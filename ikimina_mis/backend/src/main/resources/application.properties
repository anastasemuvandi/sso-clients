spring.application.name=ikimina

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/ikimina_db
spring.datasource.username=${DB_USERNAME:ikimina_user}
spring.datasource.password=${DB_PASSWORD:ikimina_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:ikimina-super-secret-key-change-in-production-must-be-256bits-long}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8081}

# Container-internal port. docker-compose maps host 8086 -> container 8080.
server.port=8080

# ── Email (SMTP) ────────────────────────────────────────────────────────────
# Defaults target the MailHog container (no auth, no TLS). View captured mail at
# http://localhost:8126 (mapped in docker-compose). Override these env vars to point at a real SMTP server.
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@ikimina.gov.rw}

# ── Verification codes (2FA + password reset) ────────────────────────────────
# How long an emailed 6-digit code stays valid, in minutes.
app.verification.code-ttl-minutes=${CODE_TTL_MINUTES:10}

# COMPARED to id_token "iss" ? stays localhost:8080 even inside Docker
app.sso.issuer-uri=${SSO_ISSUER_URI:http://localhost:8080/realms/government-internal}
# FETCHED to verify signatures ? must be reachable from where the backend runs
app.sso.jwk-set-uri=${SSO_JWK_SET_URI:http://localhost:8080/realms/government-internal/protocol/openid-connect/certs}
# browser-facing (the 302 target)
app.sso.authorization-uri=${SSO_AUTH_URI:http://localhost:8000/oauth2/authorize}
# server-side calls -> wrapper (enriched userinfo)
app.sso.token-uri=${SSO_TOKEN_URI:http://localhost:8000/oauth2/token}
app.sso.userinfo-uri=${SSO_USERINFO_URI:http://localhost:8000/auth/userinfo}
app.sso.client-id=${CLIENT_ID:ikimina-portal}
app.sso.client-secret=${CLIENT_SECRET:}
# where to bounce the browser after login (your SPA)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
