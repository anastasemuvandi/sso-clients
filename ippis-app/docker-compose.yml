services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/authdb
      SECRET_KEY: change-me-in-production
      # SSO — browser-facing URLs use localhost; server-side calls use
      # host.docker.internal so the container can reach the SSO stack on the host.
      SSO_CLIENT_ID: ippis-portal
      SSO_CLIENT_SECRET: ippis-secret-key
      SSO_AUTHORIZE_URL: http://localhost:8000/oauth2/authorize
      SSO_TOKEN_URL: http://host.docker.internal:8000/oauth2/token
      SSO_USERINFO_URL: http://host.docker.internal:8000/auth/userinfo
      SSO_LOGOUT_URL: http://localhost:8000/oauth2/logout
      REDIRECT_URI: http://localhost:5000/callback
      POST_LOGOUT_REDIRECT_URI: http://localhost:5000/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
