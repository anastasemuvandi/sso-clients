server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSO endpoints proxied to the backend so the whole login flow is single-origin
    # on this host. The X-Forwarded-* headers (with forward-headers-strategy=framework
    # on the backend) let Spring derive redirect_uri from the public host:port
    # ($http_host carries the :8180 port) instead of the internal backend:8080.
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Only the Spring callback path — NOT the SPA's own /login page (that stays
    # an Angular route served by `location /` below).
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular routing — serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}
