spring.application.name=rmis

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/rmis_db
spring.datasource.username=${DB_USERNAME:rmis_user}
spring.datasource.password=${DB_PASSWORD:rmis_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:rmis-super-secret-key-change-in-production-must-be-256bits}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# [GoR-SSO] Container-internal port. docker-compose maps host 8085 -> container 8080.
server.port=8080

# [GoR-SSO] ── Government SSO (OpenID Connect) ───────────────────────────────────
# [GoR-SSO] issuer-uri is the EXACT string Keycloak stamps into the id_token "iss"
# [GoR-SSO] claim (it is COMPARED, never fetched), so it stays localhost:8080 even
# [GoR-SSO] when the backend runs inside Docker.
app.sso.issuer-uri=${SSO_ISSUER_URI:http://localhost:8080/realms/government-internal}
# [GoR-SSO] jwk-set-uri IS fetched server-side to verify the signature, so it must be
# [GoR-SSO] reachable from where the backend runs (in Docker: host.docker.internal).
app.sso.jwk-set-uri=${SSO_JWK_SET_URI:http://localhost:8080/realms/government-internal/protocol/openid-connect/certs}
# [GoR-SSO] authorization-uri is browser-facing (the 302 target) -> localhost.
app.sso.authorization-uri=${SSO_AUTH_URI:http://localhost:8000/oauth2/authorize}
# [GoR-SSO] token-uri & userinfo-uri are called server-side -> reachable host. The
# [GoR-SSO] wrapper's /auth/userinfo returns enriched claims (agencies, client roles).
app.sso.token-uri=${SSO_TOKEN_URI:http://localhost:8000/oauth2/token}
app.sso.userinfo-uri=${SSO_USERINFO_URI:http://localhost:8000/auth/userinfo}
app.sso.client-id=${CLIENT_ID:rmis-portal}
app.sso.client-secret=${CLIENT_SECRET:}
# [GoR-SSO] SPA base URL we bounce back to after login (success -> /sso/callback#token=…).
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# [GoR-SSO] Register this redirect URI on the rmis-portal client (Spring's convention):
# [GoR-SSO]   http://localhost:8085/login/oauth2/code/gor
