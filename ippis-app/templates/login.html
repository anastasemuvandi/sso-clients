{% extends "base.html" %}
{% block title %}Sign In — IPPIS{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in to IPPIS</h1>

  {% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}

  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>
    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" aria-pressed="false">
        <svg id="pwEye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button type="submit">Sign in</button>
  </form>

  <div class="or-divider"><span>or</span></div>

  <a href="{{ url_for('sso_login') }}" class="sso-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="flex-shrink:0;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Sign in with GoR SSO
  </a>

  <div class="footer" style="margin-top:1.25rem;">
    <a href="{{ url_for('register') }}">Create a local account</a>
  </div>
</div>

<style>
  .or-divider {
    display: flex;
    align-items: center;
    margin: 1.1rem 0;
    color: #a1a1aa;
    font-size: 0.78rem;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #e4e4e7;
  }
  .or-divider span { padding: 0 0.75rem; }

  .sso-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.65rem 1rem;
    background: #1a3c6e;
    color: #fff;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s;
  }
  .sso-btn:hover { background: #2756a3; }

  /* password show/hide toggle */
  .password-wrap { position: relative; margin-bottom: 1rem; }
  .password-wrap input { margin-bottom: 0; padding-right: 2.75rem; }
  .toggle-pw {
    position: absolute; top: 0; right: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    width: auto; padding: 0 0.85rem;
    background: none; color: #a1a1aa; border: none; border-radius: 0;
    cursor: pointer; font-weight: 400;
  }
  .toggle-pw:hover { background: none; color: #52525b; }
  .toggle-pw:focus-visible { outline: 2px solid #71717a; outline-offset: -2px; }
</style>

<script>
  (function () {
    var btn = document.getElementById('togglePw');
    var input = document.getElementById('password');
    var eye = document.getElementById('pwEye');
    if (!btn || !input) return;
    var EYE = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    var EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      eye.innerHTML = show ? EYE_OFF : EYE;
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  })();
</script>
{% endblock %}
