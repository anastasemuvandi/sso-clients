{% extends "base.html" %}
{% block title %}Sign In — IPPIS{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in to IPPIS</h1>

  {% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}

  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>

  <div class="or-divider"><span>or</span></div>

  <a href="{{ url_for('sso_login') }}" class="sso-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="flex-shrink:0;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Sign in with GoR SSO
  </a>

  <div class="footer" style="margin-top:1.25rem;">
    <a href="{{ url_for('register') }}">Create a local account</a>
  </div>
</div>

<style>
  .or-divider {
    display: flex;
    align-items: center;
    margin: 1.1rem 0;
    color: #a1a1aa;
    font-size: 0.78rem;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #e4e4e7;
  }
  .or-divider span { padding: 0 0.75rem; }

  .sso-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.65rem 1rem;
    background: #1a3c6e;
    color: #fff;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s;
  }
  .sso-btn:hover { background: #2756a3; }
</style>
{% endblock %}
