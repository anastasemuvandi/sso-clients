spring.application.name=irmis

# ── Database (H2, in-memory) ─────────────────────────────────────────────────
# Zero-install local run without Docker. The schema is created on startup and
# the data is gone on shutdown. Switch the url to jdbc:h2:file:./data/irmisdb to
# persist between runs.
spring.datasource.url=jdbc:h2:mem:irmisdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console at http://localhost:8200/h2-console (JDBC URL: jdbc:h2:mem:irmisdb)
spring.h2.console.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:irmis-super-secret-key-change-in-production-must-be-256bits-long}
app.jwt.expiration-ms=86400000

# CORS — the Angular dev server origin
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8201,http://127.0.0.1:8201}

# Backend runs directly on the host (no Docker) — this is the real host port.
server.port=${SERVER_PORT:8200}

# ── Government SSO (OIDC) ─────────────────────────────────────────────────────
# COMPARED to id_token "iss" — never fetched.
app.sso.issuer-uri=${SSO_ISSUER_URI:http://localhost:8080/realms/government-internal}
# FETCHED to verify signatures — must be reachable from where the backend runs.
app.sso.jwk-set-uri=${SSO_JWK_SET_URI:http://localhost:8080/realms/government-internal/protocol/openid-connect/certs}
# browser-facing (the 302 target)
app.sso.authorization-uri=${SSO_AUTH_URI:http://localhost:8000/oauth2/authorize}
# server-side calls -> wrapper (enriched userinfo)
app.sso.token-uri=${SSO_TOKEN_URI:http://localhost:8000/oauth2/token}
app.sso.userinfo-uri=${SSO_USERINFO_URI:http://localhost:8000/auth/userinfo}
app.sso.client-id=${CLIENT_ID:irmis-portal}
app.sso.client-secret=${CLIENT_SECRET:}
# where to bounce the browser after login (your SPA)
app.frontend.url=${FRONTEND_URL:http://localhost:8201}
