{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card">
  <h1>Create account</h1>
  {% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}
  <form method="post" autocomplete="off">
    <label for="username">Username <span style="color:#a1a1aa">(min 3 chars)</span></label>
    <input id="username" type="text" name="username" required autofocus>
    <label for="password">Password <span style="color:#a1a1aa">(min 6 chars)</span></label>
    <input id="password" type="password" name="password" required>
    <button type="submit">Register</button>
  </form>
  <div class="footer">Have an account? <a href="/login">Sign in</a></div>
</div>
{% endblock %}
