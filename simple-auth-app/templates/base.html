<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Auth App{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f5; color: #18181b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; padding: 2rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #52525b; margin-bottom: 0.3rem; }
    input[type=text], input[type=password] {
      width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #d4d4d8;
      border-radius: 6px; font-size: 0.95rem; outline: none; margin-bottom: 1rem;
    }
    input:focus { border-color: #71717a; box-shadow: 0 0 0 2px #f4f4f540; }
    button {
      width: 100%; padding: 0.6rem; background: #18181b; color: #fff;
      border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: 500;
    }
    button:hover { background: #3f3f46; }
    .flash { font-size: 0.85rem; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 1rem; }
    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #71717a; }
    .footer a { color: #18181b; text-decoration: underline; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
